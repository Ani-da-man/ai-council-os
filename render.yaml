# Render Blueprint configuration for Venture Vision
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: ai-council-os
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 20
